<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <!-- Calculator body -->
  <rect x="120" y="80" width="272" height="352" rx="30" ry="30" fill="#fff" opacity="0.95"/>
  <!-- Screen -->
  <rect x="150" y="110" width="212" height="70" rx="12" ry="12" fill="#dfe6e9"/>
  <!-- Yen symbol on screen -->
  <text x="256" y="158" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#6C5CE7">¥</text>
  <!-- Calculator buttons row 1 -->
  <rect x="150" y="200" width="45" height="40" rx="8" fill="#fdcb6e"/>
  <rect x="210" y="200" width="45" height="40" rx="8" fill="#fdcb6e"/>
  <rect x="270" y="200" width="45" height="40" rx="8" fill="#fdcb6e"/>
  <rect x="330" y="200" width="32" height="40" rx="8" fill="#e17055"/>
  <!-- Calculator buttons row 2 -->
  <rect x="150" y="255" width="45" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="210" y="255" width="45" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="270" y="255" width="45" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="330" y="255" width="32" height="40" rx="8" fill="#74b9ff"/>
  <!-- Calculator buttons row 3 -->
  <rect x="150" y="310" width="45" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="210" y="310" width="45" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="270" y="310" width="45" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="330" y="310" width="32" height="40" rx="8" fill="#74b9ff"/>
  <!-- Bottom row -->
  <rect x="150" y="365" width="105" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="270" y="365" width="45" height="40" rx="8" fill="#dfe6e9"/>
  <rect x="330" y="365" width="32" height="40" rx="8" fill="#00b894"/>
  <!-- Cute sparkle -->
  <text x="95" y="110" font-size="36" fill="#ffeaa7">✨</text>
  <text x="380" y="85" font-size="28" fill="#ffeaa7">✨</text>
  <!-- Small document icon -->
  <g transform="translate(370, 340) scale(0.6)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="#fff" stroke="#6C5CE7" stroke-width="4"/>
    <line x1="15" y1="25" x2="65" y2="25" stroke="#b2bec3" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="45" x2="55" y2="45" stroke="#b2bec3" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="65" x2="50" y2="65" stroke="#b2bec3" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
